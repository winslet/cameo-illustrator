name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS only, because that is the only platform the plugin runs on. A green
  # Ubuntu build would prove nothing a user could rely on.
  #
  # Both Python versions cover a configuration we actually ship: 3.12 is the
  # interpreter bundled in the .pkg installer, and 3.14 stands in for the recent
  # Python a .zxp user brings themselves, since that install uses whatever is on
  # their machine. Together with the 3.9 job below they bracket the supported
  # range at both ends and in the middle.
  python:
    name: Python ${{ matrix.python }} on macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Exercises the same vendoring path a release uses, rather than a
      # pip install that would not prove the shipped layout works.
      - name: Vendor Python dependencies
        run: PYTHON=$(which python) scripts/vendor-pydeps.sh

      - name: Install test tooling
        run: python -m pip install --quiet pytest

      - name: Run tests
        working-directory: helper
        run: PYTHONPATH=. python -m pytest tests/ -q

  # The floor of the documented support range, and the version macOS itself
  # ships — so for many users this is the interpreter that actually runs.
  #
  # Separate from the matrix above because pytest needs 3.10+, so this exercises
  # the runtime rather than running the suite. That is the claim that matters:
  # users run the helper, not pytest.
  #
  # On Ubuntu deliberately. 3.9 predates Apple Silicon, so arm64 macOS builds are
  # unreliable on the runners; what is being checked here is language-level
  # compatibility, which is platform-independent. This is also the only job that
  # exercises the Linux side of the vendored libusb.
  python-floor:
    name: Python 3.9 runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Vendor Python dependencies
        run: PYTHON=$(which python) scripts/vendor-pydeps.sh

      - name: Helper self-test
        run: PYTHONPATH=helper python -m cameo_helper --selftest

      - name: Exercise the cut pipeline
        run: |
          PYTHONPATH=helper python - <<'PY'
          from cameo_helper import jobs, simulator

          square = [[(10, 10), (30, 10), (30, 30), (10, 30), (10, 10)]]
          triangle = [[(50, 50), (70, 50), (60, 70), (50, 50)]]

          plain = jobs.run_cut(jobs.CutParams(paths=square, dry_run=True))
          assert plain.bbox["width_mm"] == 20.0, plain.bbox

          # Covers the patched MatFree, which crashes upstream on disjoint shapes.
          matless = jobs.run_cut(
              jobs.CutParams(paths=square + triangle, dry_run=True, matless=True)
          )
          assert matless.path_count >= 2

          decoded = simulator.parse(plain.transcript)
          assert decoded.bbox() == (10.0, 10.0, 30.0, 30.0), decoded.bbox()
          print("cut pipeline OK on the documented minimum Python")
          PY

  # One Node version, on macOS.
  #
  # Nothing ships on this Node. The panel's JavaScript runs inside CEP, which
  # bundles Node 8.6 to 17.7 depending on the Illustrator version — so every
  # version a runner can offer is newer than any real host, and a matrix of them
  # was measuring the wrong axis. Compatibility with the oldest host is enforced
  # precisely by scripts/check-panel-syntax.js instead, which runs below.
  #
  # So Node here is just the vehicle that runs the suite: 22 because it is the
  # active LTS, and macOS because the RPC test spawns the real helper process and
  # that is the platform it does so on for real users.
  javascript:
    name: JavaScript
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The RPC tests spawn the real helper through the real resolver, so the
      # checkout needs the same layout a dev install has.
      - name: Prepare the helper
        run: |
          PYTHON=$(which python) scripts/vendor-pydeps.sh
          scripts/link-helper.sh

      - name: Run tests
        # Unquoted: the shell expands the glob. Node only globs from v22.
        run: node --test cep/test/*.test.js

      # The matrix above is all far newer than the oldest supported host
      # (Illustrator 2020 runs CEP 9 / Chromium 61), so it cannot catch syntax
      # that would stop the panel loading there.
      - name: Check panel syntax against the oldest supported host
        run: node scripts/check-panel-syntax.js

  # The highest-value job here: it builds the artefact users actually download
  # and then runs the helper out of the unpacked .zxp with no virtualenv, no
  # Homebrew and no repository. Unit tests pass against the source tree; only
  # this proves the thing we ship stands on its own.
  package:
    name: Package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Adobe only ships ZXPSignCmd as an x86_64 binary, and GitHub's macOS
      # runners are arm64 without Rosetta preinstalled.
      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Build the extension
        run: PYTHON=$(which python) scripts/build-zxp.sh

      # Proves the packaged tree stands alone: no virtualenv, no Homebrew, no
      # repository — the situation a user is actually in.
      - name: Check the package works unpacked
        run: |
          mkdir -p /tmp/zxpcheck
          unzip -q dist/*.zxp -d /tmp/zxpcheck
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            PYTHONPATH=/tmp/zxpcheck/helper python -m cameo_helper --selftest

      # Self-signed with a throwaway certificate generated in the runner, so it
      # is fine for testing a branch but is not a release artefact.
      - uses: actions/upload-artifact@v7
        with:
          name: zxp-preview-selfsigned
          path: dist/*.zxp
          retention-days: 14

  # Five seconds, and it has already caught two real bugs — including echo
  # mangling the backslashes in dev-install.sh's Windows paths. The build and
  # install scripts are shell, so they are otherwise unexercised by any test.
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck scripts/*.sh
